name: Liquidity Risk Validation Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "outputs/**"
      - "reports/generated/**"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest
      - name: Run liquidity and ILAAP pipeline
        run: python run_pipeline.py
      - name: Persist reproducible evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs reports/generated
          if git diff --cached --quiet; then
            echo "No generated evidence changed."
          else
            git commit -m "chore: refresh reproducible liquidity evidence [skip ci]"
            git push
          fi
